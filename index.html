<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BLT Brilliant - Proposal Generator & Technical Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- Top Corporate Branding Bar with Theme Toggle -->
    <header class="top-navbar">
      <div class="brand-container">
        <img 
          src="logo.png" 
          alt="BLT BRILLIANT - Technology Leads Market ♦ Service Creates Value" 
          class="company-logo-img"
          onerror="this.onerror=null; this.src='https://placehold.co/460x115/ffffff/005696?text=BLT+BRILLIANT';"
        />
      </div>

      <!-- Light / Dark Mode Toggle -->
      <button type="button" id="btnThemeToggle" class="theme-toggle-btn" aria-label="Toggle Theme">
        <span class="theme-icon" id="themeIcon">🌙</span>
        <span id="themeText">Dark Mode</span>
      </button>
    </header>

    <!-- Sales Representative Bar: Only Name Visible (Auto-Updates from Database Sheet) -->
    <div class="sales-strip">
      <div class="sales-strip-label">
        <span>👤 Sales Representative</span>
      </div>
      <select id="salesPersonSelect" class="sales-strip-select" title="Assigned Sales Representative" required>
        <option value="" disabled selected>Loading sales team...</option>
      </select>
    </div>

    <!-- Main Proposal Form -->
    <form id="proposalForm" novalidate>

      <!-- Customer & Project Information Card -->
      <section class="form-card">
        <h2 class="card-title">
          <span class="card-title-icon">📋</span> Customer &amp; Project Information
        </h2>
        
        <!-- Customer & Contact Person -->
        <div class="grid-2">
          <div class="form-group">
            <label for="customerName">Customer / Company Name <span class="req">*</span></label>
            <input type="text" id="customerName" class="form-control" placeholder="" required autocomplete="organization">
          </div>
          
          <div class="form-group">
            <label for="contactPerson">
              <span>Contact Person Name <span class="req">*</span></span>
              <span class="label-checkpoint" title="Copy from Customer / Company Name">
                <input type="checkbox" id="chkSameCustomer"> Same as Customer
              </span>
            </label>
            <input type="text" id="contactPerson" class="form-control" placeholder="" required autocomplete="name">
          </div>
        </div>

        <!-- Phone & State -->
        <div class="grid-2">
          <div class="form-group">
            <label for="contactPhone">Contact Phone Number (10 Digits) <span class="req">*</span></label>
            <input type="tel" id="contactPhone" class="form-control" placeholder="" maxlength="10" inputmode="numeric" pattern="[0-9]{10}" required autocomplete="tel">
          </div>
          
          <div class="form-group">
            <label for="state">State / Territory <span class="req">*</span></label>
            <select id="state" class="form-control" required>
              <option value="" disabled selected>Select State / UT</option>
              <optgroup label="Popular States">
                <option value="West Bengal">West Bengal</option>
                <option value="Odisha">Odisha</option>
                <option value="Bihar">Bihar</option>
                <option value="Jharkhand">Jharkhand</option>
                <option value="Assam">Assam</option>
                <option value="Delhi">Delhi</option>
              </optgroup>
              <optgroup label="All States & Union Territories">
                <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                <option value="Andhra Pradesh">Andhra Pradesh</option>
                <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                <option value="Assam">Assam</option>
                <option value="Bihar">Bihar</option>
                <option value="Chandigarh">Chandigarh</option>
                <option value="Chhattisgarh">Chhattisgarh</option>
                <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
                <option value="Delhi">Delhi</option>
                <option value="Goa">Goa</option>
                <option value="Gujarat">Gujarat</option>
                <option value="Haryana">Haryana</option>
                <option value="Himachal Pradesh">Himachal Pradesh</option>
                <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                <option value="Jharkhand">Jharkhand</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Kerala">Kerala</option>
                <option value="Ladakh">Ladakh</option>
                <option value="Lakshadweep">Lakshadweep</option>
                <option value="Madhya Pradesh">Madhya Pradesh</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Manipur">Manipur</option>
                <option value="Meghalaya">Meghalaya</option>
                <option value="Mizoram">Mizoram</option>
                <option value="Nagaland">Nagaland</option>
                <option value="Odisha">Odisha</option>
                <option value="Puducherry">Puducherry</option>
                <option value="Punjab">Punjab</option>
                <option value="Rajasthan">Rajasthan</option>
                <option value="Sikkim">Sikkim</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Telangana">Telangana</option>
                <option value="Tripura">Tripura</option>
                <option value="Uttar Pradesh">Uttar Pradesh</option>
                <option value="Uttarakhand">Uttarakhand</option>
                <option value="West Bengal">West Bengal</option>
                <option value="Other">Other</option>
              </optgroup>
            </select>
          </div>
        </div>

        <!-- Office Address -->
        <div class="grid-2">
          <div class="form-group">
            <label for="address1">Office Address Line 1 <span class="req">*</span></label>
            <input type="text" id="address1" class="form-control" placeholder="" required autocomplete="street-address">
          </div>
          
          <div class="form-group">
            <label for="address2">Office Address Line 2</label>
            <input type="text" id="address2" class="form-control" placeholder="">
          </div>
        </div>

        <div class="form-group">
          <label for="pinCode">Office PIN Code <span class="req">*</span></label>
          <input type="text" id="pinCode" class="form-control" placeholder="" maxlength="6" inputmode="numeric" required autocomplete="postal-code">
        </div>

        <!-- Site Address -->
        <div class="form-group">
          <label for="siteAddress">
            <span>Site Address (Project Site Location) <span class="req">*</span></span>
            <span class="label-checkpoint" title="Copy from Office Address & PIN">
              <input type="checkbox" id="chkSameAddress"> Same as Office Address & PIN
            </span>
          </label>
          <input type="text" id="siteAddress" class="form-control" placeholder="" required>
        </div>

        <div class="form-group">
          <label for="sitePinCode">Site PIN Code <span class="req">*</span></label>
          <input type="text" id="sitePinCode" class="form-control" placeholder="" maxlength="6" inputmode="numeric" required>
        </div>
      </section>

      <!-- Multi-Lift Specifications Container -->
      <section>
        <div id="liftsContainer">
          <!-- Initial Elevator Card will be inserted cleanly here -->
        </div>

        <!-- Add Elevator Button -->
        <button type="button" id="btnAddLift" class="btn-add-lift">
          <span style="font-size: 18px; font-weight: 800;">+</span> Add Another Elevator Specification
        </button>
      </section>

      <!-- Technical Summary Card -->
      <section class="tech-summary-card">
        <div class="tech-summary-title">Technical Configuration Overview</div>
        <div class="tech-summary-grid">
          <div class="tech-stat-item">
            <span class="stat-label">Total Elevators Configured</span>
            <span class="stat-val" id="sumUnits">0 Units</span>
          </div>
          <div class="tech-stat-item" style="flex: 2;">
            <span class="stat-label">Configuration Breakdown</span>
            <span class="stat-val" id="sumTypes" style="font-size: 14.5px; font-weight: 600; color: #f1f5f9;">-</span>
          </div>
        </div>
      </section>

      <!-- Submit Action -->
      <button type="submit" id="btnSubmit" class="btn-submit">
        <span>🚀 Submit &amp; Generate Technical Proposal</span>
      </button>

    </form>
  </div>

  <!-- Thank You Feedback Modal (No Direct File Access Given) -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-box">
      <div id="modalBody">
        <!-- Injected via JavaScript -->
      </div>
      <button type="button" id="btnModalClose" class="btn-modal-close">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BLT Brilliant Lifts & Escalators - Proposal Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       THEME VARIABLES & RESET
       ========================================================= */
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --surface-card: #ffffff;
      --border: #cbd5e1;
      --border-focus: #005696;
      --text: #0f172a;
      --text-muted: #475569;
      --text-light: #94a3b8;

      --blt-blue: #005696;
      --blt-blue-dark: #003e6d;
      --blt-orange: #f58220;
      --blt-orange-hover: #e06d0b;

      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --warning-bg: #fffbeb;
      --warning-border: #f59e0b;
      --warning-text: #92400e;
      --success-bg: #f0fdf4;
      --success-border: #22c55e;
      --success-text: #15803d;

      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 16px 32px rgba(11, 25, 44, 0.1);
    }

    [data-theme="dark"] {
      --bg: #0b111e;
      --surface: #131c2e;
      --surface-subtle: #1c273e;
      --surface-card: #141f33;
      --border: #24324f;
      --border-focus: #38bdf8;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-light: #64748b;

      --blt-blue: #0284c7;
      --blt-blue-dark: #0369a1;
      --blt-orange: #f97316;
      --blt-orange-hover: #ea580c;

      --danger-bg: rgba(239, 68, 68, 0.15);
      --warning-bg: rgba(245, 158, 11, 0.15);
      --warning-text: #fcd34d;
      --success-bg: rgba(34, 197, 94, 0.15);
      --success-text: #4ade80;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 20px 35px rgba(0, 0, 0, 0.6);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: 16px 12px 80px 12px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    @media (min-width: 768px) {
      body {
        padding: 30px 24px 90px 24px;
      }
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    /* Top Navbar & Branding */
    .top-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-container {
      display: flex;
      align-items: center;
    }

    .brand-logo-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .company-logo-img {
      height: 50px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
      transition: opacity 0.25s ease;
    }

    @media (min-width: 768px) {
      .company-logo-img {
        height: 58px;
      }
    }

    /* Show Light Mode Logo in Light Theme, Hide Dark Mode Logo */
    .logo-light-mode {
      display: inline-flex;
    }

    .logo-dark-mode {
      display: none;
    }

    /* Show Dark Mode Logo in Dark Theme, Hide Light Mode Logo */
    [data-theme="dark"] .logo-light-mode {
      display: none;
    }

    [data-theme="dark"] .logo-dark-mode {
      display: inline-flex;
    }

    .theme-toggle-btn {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 9999px;
      padding: 8px 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600;
      min-height: 42px;
      outline: none;
      user-select: none;
      transition: background-color 0.2s, border-color 0.2s, transform 0.15s;
    }

    .theme-toggle-btn:hover {
      border-color: var(--blt-blue);
      transform: translateY(-1px);
    }

    .theme-toggle-btn:active {
      transform: translateY(0);
    }

    .theme-icon {
      font-size: 16px;
      display: inline-block;
      transition: transform 0.3s ease;
    }

    /* Sales Representative Bar */
    .sales-strip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 5px solid var(--blt-blue);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    @media (min-width: 640px) {
      .sales-strip {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .sales-strip-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sales-strip-select {
      width: 100%;
      height: 48px;
      min-height: 48px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background-color: var(--surface-subtle);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      box-sizing: border-box;
    }

    @media (min-width: 640px) {
      .sales-strip-select {
        width: 360px;
      }
    }

    .sales-strip-select:focus {
      border-color: var(--blt-blue);
      box-shadow: 0 0 0 3px rgba(0, 86, 150, 0.2);
    }

    /* Best-Fit Auto-Selected Clear Door Width Display */
    .door-w-display-wrap {
      width: 100%;
    }

    .door-w-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      min-height: 48px;
      padding: 0 12px;
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      background-color: var(--surface-subtle);
      color: var(--text-light);
      font-size: 12.5px;
      font-weight: 500;
      text-align: center;
      box-sizing: border-box;
    }

    .door-w-best-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      min-height: 48px;
      padding: 0 14px;
      border: 1.5px solid var(--blt-blue);
      border-radius: var(--radius-sm);
      background-color: rgba(0, 86, 150, 0.08);
      color: var(--blt-blue);
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 0 0 1px rgba(0, 86, 150, 0.15);
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    .door-w-best-left {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .door-w-best-pill input[type="radio"] {
      width: 16px;
      height: 16px;
      accent-color: var(--blt-blue);
      margin: 0;
      cursor: pointer;
    }

    .door-w-best-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 2px 8px;
      border-radius: 9999px;
      background-color: var(--blt-blue);
      color: #ffffff;
    }

    [data-theme="dark"] .door-w-best-pill {
      background-color: rgba(2, 132, 199, 0.16);
      color: #38bdf8;
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.25);
    }

    [data-theme="dark"] .door-w-best-badge {
      background-color: #0284c7;
      color: #ffffff;
    }

    /* Sub-section Dividers inside Cards */
    .spec-section-block {
      margin-bottom: 20px;
      padding-bottom: 6px;
      border-bottom: 1px dashed var(--border);
    }

    .spec-section-block:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .spec-section-label {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--blt-blue);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Form Cards & Grids */
    .form-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px 18px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    @media (min-width: 768px) {
      .form-card {
        padding: 30px 28px;
      }
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 22px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title-icon {
      font-size: 20px;
    }

    .grid-2, .grid-3, .grid-4 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      margin-bottom: 16px;
    }

    @media (min-width: 640px) {
      .grid-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 768px) {
      .grid-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .grid-4 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .grid-address-office {
        grid-template-columns: 2fr 1.5fr 1fr;
      }
      .grid-address-site {
        grid-template-columns: 3fr 1fr;
      }
    }

    .grid-address-office, .grid-address-site {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      margin-bottom: 16px;
    }

    @media (min-width: 992px) {
      .grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-width: 0;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 20px;
    }

    .req {
      color: var(--danger);
      font-weight: 700;
      margin-left: 2px;
    }

    .form-control {
      width: 100%;
      height: 48px;
      min-height: 48px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      color: var(--text);
      background-color: var(--surface);
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(0, 86, 150, 0.18);
    }

    .form-control:disabled,
    .form-control[readonly] {
      background-color: var(--surface-subtle);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .label-checkpoint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--blt-blue);
      cursor: pointer;
      user-select: none;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--surface-subtle);
    }

    .label-checkpoint input[type="checkbox"] {
      accent-color: var(--blt-blue);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    /* Combined Shaft Dimensions Box */
    .shaft-dim-combined {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .shaft-dim-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 8px;
      height: 48px;
      min-height: 48px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .shaft-dim-input-wrap:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(0, 86, 150, 0.18);
    }

    .shaft-dim-input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
      padding: 0 4px;
    }

    .shaft-dim-sublabel {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-light);
      margin-left: 4px;
      user-select: none;
    }

    .shaft-dim-separator {
      font-weight: 800;
      color: var(--blt-orange);
      font-size: 16px;
      user-select: none;
      padding: 0 2px;
    }

    .shaft-dim-unit {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      user-select: none;
      margin-left: 2px;
    }

    /* Engineering Helper Box */
    .eng-helper-box {
      background-color: var(--surface-subtle);
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .eng-helper-text {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .eng-helper-text strong {
      color: var(--blt-blue);
    }

    .btn-autofill-dims {
      background-color: var(--surface);
      border: 1px solid var(--blt-blue);
      color: var(--blt-blue);
      border-radius: var(--radius-sm);
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-autofill-dims:hover {
      background-color: var(--blt-blue);
      color: #ffffff;
    }

    /* Elevator Specification Cards */
    .lift-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-top: 4px solid var(--blt-orange);
      border-radius: var(--radius-lg);
      padding: 24px 18px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    @media (min-width: 768px) {
      .lift-card {
        padding: 28px 26px;
      }
    }

    .lift-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .lift-badge {
      background-color: var(--blt-blue);
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .btn-remove-lift {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      min-height: 36px;
      transition: background-color 0.2s;
    }

    .btn-remove-lift:hover {
      background-color: var(--danger-bg);
    }

    .dim-alert {
      display: none;
      background-color: var(--warning-bg);
      border-left: 4px solid var(--warning-border);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      font-size: 13px;
      color: var(--warning-text);
      line-height: 1.45;
    }

    .checkbox-feature-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      background: var(--surface-subtle);
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      height: 48px;
      min-height: 48px;
      box-sizing: border-box;
      width: 100%;
    }

    .checkbox-feature-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--blt-orange);
      cursor: pointer;
    }

    .btn-add-lift {
      width: 100%;
      background-color: var(--surface);
      color: var(--blt-blue);
      border: 2px dashed var(--border);
      padding: 14px;
      border-radius: var(--radius-lg);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
      min-height: 52px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .btn-add-lift:hover {
      border-color: var(--blt-blue);
      background-color: var(--surface-subtle);
    }

    /* Technical Summary & Submit */
    .tech-summary-card {
      background: linear-gradient(135deg, var(--blt-blue-dark) 0%, var(--blt-blue) 100%);
      color: #ffffff;
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-lg);
    }

    .tech-summary-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--blt-orange);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    .tech-summary-grid {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .tech-stat-item {
      display: flex;
      flex-direction: column;
    }

    .tech-stat-item .stat-label {
      font-size: 12px;
      color: #cbd5e1;
    }

    .tech-stat-item .stat-val {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--blt-orange);
      color: #ffffff;
      border: none;
      padding: 16px 20px;
      border-radius: var(--radius-lg);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(245, 130, 32, 0.4);
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.15s;
    }

    .btn-submit:hover {
      background-color: var(--blt-orange-hover);
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* Modal Overlays */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 17, 30, 0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      max-width: 480px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      animation: modalFadeIn 0.25s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-icon {
      font-size: 48px;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 12px;
    }

    .modal-msg {
      font-size: 14.5px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .btn-modal-close {
      background: var(--blt-blue);
      color: #ffffff;
      border: none;
      padding: 12px 30px;
      border-radius: var(--radius-sm);
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-modal-close:hover {
      background: var(--blt-blue-dark);
    }

    .spinner {
      border: 4px solid var(--surface-subtle);
      border-top: 4px solid var(--blt-orange);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 16px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Top Corporate Branding Bar with Theme Switcher -->
    <header class="top-navbar">
      <!-- =========================================================
           COMPANY LOGO SECTION (LIGHT MODE & DARK MODE)
           Place your Light Mode and Dark Mode logo URLs in the href below
           ========================================================= -->
      <div class="brand-container">

    /* Sync Logo href & img src so pasting image URL in href updates the image automatically */
    function initLogoHrefSync() {
      const pairs = [
        { linkId: "logoLightLink", imgId: "logoLightImg" },
        { linkId: "logoDarkLink", imgId: "logoDarkImg" }
      ];

      pairs.forEach(({ linkId, imgId }) => {
        const link = document.getElementById(linkId);
        const img = document.getElementById(imgId);
        if (!link || !img) return;

        const hrefVal = (link.getAttribute("href") || "").trim();
        const srcVal = (img.getAttribute("src") || "").trim();
        const isHrefSet = hrefVal && !hrefVal.includes("YOUR_") && hrefVal !== "#";
        const isSrcSet = srcVal && !srcVal.includes("YOUR_") && srcVal !== "#";

        if (isHrefSet && !isSrcSet) {
          img.src = hrefVal;
        } else if (isSrcSet && !isHrefSet) {
          link.href = srcVal;
        }

        link.addEventListener("click", (e) => {
          const currentHref = (link.getAttribute("href") || "").trim();
          if (!currentHref || currentHref.includes("YOUR_") || currentHref === "#") {
            e.preventDefault();
          }
        });
      });
    }

    /* Theme Engine */
    function initTheme() {
      let savedTheme = "light";
      try {
        savedTheme = localStorage.getItem("blt_theme") || "light";
      } catch (e) {}
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme") || "light";
      const target = current === "dark" ? "light" : "dark";
      applyTheme(target);
      try {
        localStorage.setItem("blt_theme", target);
      } catch (e) {}
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme") || "light";
      const target = current === "dark" ? "light" : "dark";
      applyTheme(target);
      localStorage.setItem("blt_theme", target);
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      const icon = document.getElementById("themeIcon");
      const text = document.getElementById("themeText");

      if (theme === "dark") {
        if (icon) icon.textContent = "☀️";
        if (text) text.textContent = "Light Mode";
      } else {
        if (icon) icon.textContent = "🌙";
        if (text) text.textContent = "Dark Mode";
      }
    }

    /* Dynamic Sales Team Loader */
    async function initSalesTeamProfile() {
      let teamLoaded = false;

      if (APPS_SCRIPT_WEB_APP_URL && !APPS_SCRIPT_WEB_APP_URL.includes("YOUR_APPS_SCRIPT")) {
        try {
          const res = await fetch(`${APPS_SCRIPT_WEB_APP_URL}?action=getSalesTeam&spreadsheetId=${SPREADSHEET_ID}`);
          const data = await res.json();
          if (data && data.status === "success" && Array.isArray(data.salesTeam) && data.salesTeam.length > 0) {
            salesTeamData = data.salesTeam.map(item => ({
              name: String(item.name || "").trim(),
              territory: String(item.territory || "").trim()
            })).filter(item => item.name);
            populateSalesDropdown(salesTeamData);
            teamLoaded = true;
          }
        } catch (err) {
          console.warn("Live sales team API fetch bypassed:", err);
        }
      }

      if (!teamLoaded && SPREADSHEET_ID) {
        try {
          const csvUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent("Sales Team")}`;
          const res = await fetch(csvUrl);
          const text = await res.text();
          const rows = text.split("\n").map(r => r.split(","));
          const parsed = [];

          for (let i = 1; i < rows.length; i++) {
            const rawName = rows[i][0] ? rows[i][0].replace(/['"]/g, "").trim() : "";
            const rawTerr = rows[i][4] ? rows[i][4].replace(/['"]/g, "").trim() : "";
            if (rawName && !parsed.some(p => p.name === rawName)) {
              parsed.push({ name: rawName, territory: rawTerr });
            }
          }

          if (parsed.length > 0) {
            salesTeamData = parsed;
            populateSalesDropdown(salesTeamData);
            teamLoaded = true;
          }
        } catch (e) {
          console.warn("Direct sheet CSV fetch bypassed:", e);
        }
      }

      if (!teamLoaded) {
        populateSalesDropdown(salesTeamData);
      }
    }

    function populateSalesDropdown(team) {
      const select = document.getElementById("salesPersonSelect");
      if (!select) return;

      const currentVal = select.value;
      select.innerHTML = '<option value="" disabled selected>Select Sales Representative</option>';

      team.forEach(rep => {
        const opt = document.createElement("option");
        opt.value = rep.name;
        opt.textContent = rep.name;
        if (rep.territory) opt.dataset.territory = rep.territory;
        select.appendChild(opt);
      });

      if (currentVal && Array.from(select.options).some(o => o.value === currentVal)) {
        select.value = currentVal;
      }

      select.addEventListener("change", handleSalesPersonChange);
    }

      const select = document.getElementById("salesPersonSelect");
      const selectedName = (select.value || "").toUpperCase();

      const territory = selectedOpt ? selectedOpt.dataset.territory : "";

      const stateSelect = document.getElementById("state");

          setMatchingState(territory);
        } else if (selectedName.includes("BIKASH") || selectedName.includes("BIJAYA")) {

          stateSelect.value = "Assam";

    /* Form Validation & Checkpoints */
    function setupFormCheckpointsAndValidation() {

      const contactPhone = document.getElementById("contactPhone");

      chkSameCustomer.addEventListener("change", () => {
        if (chkSameCustomer.checked) {
          contactPerson.value = customerName.value.trim();
          contactPerson.readOnly = true;
        } else {
          contactPerson.readOnly = false;
        }
      });

      customerName.addEventListener("input", () => {
        if (chkSameCustomer.checked) {
          contactPerson.value = customerName.value.trim();
        }

      function syncSiteAddressAndPin() {
        if (chkSameAddress.checked) {
          const parts = [address1.value.trim(), address2.value.trim()].filter(Boolean);
          siteAddress.value = parts.join(", ");
          siteAddress.readOnly = true;
          sitePinCode.value = pinCode.value.trim();
          sitePinCode.readOnly = true;
        } else {
          siteAddress.readOnly = false;
          sitePinCode.readOnly = false;
        }
      }

      chkSameAddress.addEventListener("change", syncSiteAddressAndPin);
      address1.addEventListener("input", syncSiteAddressAndPin);
      address2.addEventListener("input", syncSiteAddressAndPin);

      function handlePinAutoState(inputElem) {
        const cleanPin = inputElem.value.replace(/\D/g, "").slice(0, 6);
        inputElem.value = cleanPin;

        if (cleanPin.length >= 2) {
          const detected = getStateFromPinCode(cleanPin);
          if (detected) setMatchingState(detected);
        }
      }

      pinCode.addEventListener("input", function() {
        handlePinAutoState(this);
        if (chkSameAddress.checked) sitePinCode.value = this.value;
      });

      sitePinCode.addEventListener("input", function() {
        handlePinAutoState(this);
      });

      contactPhone.addEventListener("input", function() {
        this.value = this.value.replace(/\D/g, "").slice(0, 10);
      });
    }

    function removeLiftCard(btnOrElement) {
      const cards = document.querySelectorAll(".lift-card");
      if (cards.length <= 1) return;
      const card = btnOrElement.closest(".lift-card");
      if (card) {
        card.remove();
        renumberAllLifts();
      }
    }

    function renumberAllLifts() {
      const cards = document.querySelectorAll(".lift-card");
      cards.forEach((card, idx) => {
        const liftNum = idx + 1;
        card.id = `liftCard_${liftNum}`;
        card.dataset.liftIndex = liftNum;

        const badge = card.querySelector(".lift-badge");
        if (badge) badge.innerText = `Elevator #${liftNum} Specification`;

        const alertBox = card.querySelector(".dim-alert");
        if (alertBox) alertBox.id = `dimAlert_${liftNum}`;

        const radios = card.querySelectorAll(".lift-door-w-radio");
        radios.forEach(r => {
          r.name = `doorWidth_${liftNum}`;
        });
      });

      const buttons = document.querySelectorAll(".btn-remove-lift");
      buttons.forEach(btn => {
        btn.style.display = cards.length > 1 ? "block" : "none";
      });

      updateTechnicalSummary();
    }

    /* IS 14665 Engineering Dimensions Guide */
    function updateEngineeringGuide(card) {
      if (!card) return;
      const type = card.querySelector(".lift-type").value;
      const capSelect = card.querySelector(".lift-capacity");
      const cap = capSelect ? capSelect.value : "";
      const helperBox = card.querySelector(".eng-helper-box");
      const helperSpan = card.querySelector(".eng-helper-dims");
      const carDimInput = card.querySelector(".lift-cardim");
      if (carDimInput) carDimInput.value = "Shall be as per GA Drawing";
      if (!helperBox || !helperSpan) return;

      if (!type || !cap) {
        helperBox.style.display = "none";
        helperSpan.textContent = "";
        return;
      }

      const recTable = IS_14665_RECOMMENDED[type];
      const rec = recTable ? recTable[cap] : null;

      if (rec) {
        helperBox.style.display = "flex";
        helperSpan.textContent = `Rec. Shaft: ${rec.shaftW}(W)×${rec.shaftD}(D) mm | Rec. Door: ${rec.doorW} mm`;
      } else {
        helperBox.style.display = "none";
        helperSpan.textContent = "";
      }
    }

    function autoFillRecommendedDimensions(btn) {
      const card = btn.closest(".lift-card");
      if (!card) return;

      const type = card.querySelector(".lift-type").value;
      const cap = card.querySelector(".lift-capacity").value;
      const recTable = IS_14665_RECOMMENDED[type];
      const rec = recTable ? recTable[cap] : null;

      if (rec) {
        card.querySelector(".lift-shaft-w").value = rec.shaftW;
        card.querySelector(".lift-shaft-d").value = rec.shaftD;
        card.querySelector(".lift-door-type").value = rec.doorType;

        const carDim = card.querySelector(".lift-cardim");
        if (carDim) carDim.value = "Shall be as per GA Drawing";

        handleShaftOrDoorChange(card.querySelector(".lift-shaft-w"));
      }
    }

    function updateFlooringOptions(card) {
      if (!card) return;
      const type = card.querySelector(".lift-type").value;
      const flooringSelect = card.querySelector(".lift-flooring");
      if (!flooringSelect) return;

      const currentVal = flooringSelect.value;
      flooringSelect.innerHTML = "";

      if (type === "GOODS") {
        flooringSelect.innerHTML = `<option value="MS Chequered Plate" selected>MS Chequered Plate</option>`;
      } else {
        const isKalyan = isKalyanSelected();
        const defaultVal = isKalyan ? "PVC Flooring - Wooden Type" : "";
        const activeVal = (currentVal && currentVal !== "MS Chequered Plate") ? currentVal : defaultVal;

        flooringSelect.innerHTML = `
          <option value="" disabled ${!activeVal ? "selected" : ""}>Select Car Flooring</option>
          <option value="PVC Flooring" ${activeVal === "PVC Flooring" ? "selected" : ""}>PVC Flooring</option>
          <option value="PVC Flooring - Wooden Type" ${activeVal === "PVC Flooring - Wooden Type" ? "selected" : ""}>PVC Flooring - Wooden Type</option>
          <option value="Granite Flooring - By Customer" ${activeVal === "Granite Flooring - By Customer" ? "selected" : ""}>Granite Flooring - By Customer</option>
        `;
      }
    }

    function handleLiftTypeChange(element) {
      const card = element.closest(".lift-card");
      if (!card) return;

      const type = card.querySelector(".lift-type").value;
      const mrSelect = card.querySelector(".lift-mr");
      const tractionSelect = card.querySelector(".lift-traction");

      renderCapacityDropdown(card, type);

      if (type === "GOODS") {
        mrSelect.disabled = false;
        if (mrSelect.value === "MRL") {
          tractionSelect.value = "Gearless";
          tractionSelect.disabled = true;
        } else {
          tractionSelect.disabled = false;
        }
      } else if (type === "HOME LIFT") {
        mrSelect.value = "MRL";
        mrSelect.disabled = true;
        tractionSelect.value = "Gearless";
        tractionSelect.disabled = true;
      } else {
        mrSelect.disabled = false;
        if (mrSelect.value === "MRL") {
          tractionSelect.value = "Gearless";
          tractionSelect.disabled = true;
        } else {
          tractionSelect.disabled = false;
        }
      }

      updateFlooringOptions(card);
      updateHiddenLiftFields(card);
      updateEngineeringGuide(card);
      updateBestDoorWidth(card);
      updateTechnicalSummary();
    }

    function handleCapacityChange(element) {
      const card = element.closest(".lift-card");
      if (!card) return;

      const type = card.querySelector(".lift-type").value;
      const loadInput = card.querySelector(".lift-load");

      if (type === "GOODS") {
        const kgVal = card.querySelector(".lift-capacity").value;
        if (loadInput) {
          loadInput.value = kgVal ? (kgVal.includes("Kg") ? kgVal : `${kgVal} Kg`) : "";
        }
      } else {
        const pax = parseInt(card.querySelector(".lift-capacity").value, 10);
        if (loadInput) {
          loadInput.value = pax ? `${pax * 68} Kg` : "";
        }
      }

      updateEngineeringGuide(card);
      updateBestDoorWidth(card);
      updateTechnicalSummary();
    }

    function handleMachineAndTractionChange(element) {
      const card = element.closest(".lift-card");
      if (!card) return;

      const type = card.querySelector(".lift-type").value;
      const mrSelect = card.querySelector(".lift-mr");
      const tractionSelect = card.querySelector(".lift-traction");

      if (type === "HOME LIFT") {
        mrSelect.value = "MRL";
        mrSelect.disabled = true;
        tractionSelect.value = "Gearless";
        tractionSelect.disabled = true;
      } else if (mrSelect.value === "MRL") {
        tractionSelect.value = "Gearless";
        tractionSelect.disabled = true;
      } else if (mrSelect.value === "MR") {
        tractionSelect.disabled = false;
      }

      updateHiddenLiftFields(card);
    }

    function updateHiddenLiftFields(card) {
      if (!card) return;

      const type = card.querySelector(".lift-type").value;
      const mr = card.querySelector(".lift-mr").value;
      const traction = card.querySelector(".lift-traction").value;
      const capSelect = card.querySelector(".lift-capacity");
      const capVal = capSelect ? capSelect.value : "";

      const loadInput = card.querySelector(".lift-load");
      if (loadInput) {
        if (!type || !capVal) {
          loadInput.value = "";
        } else if (type === "GOODS") {
          loadInput.value = capVal.includes("Kg") ? capVal : `${capVal} Kg`;
        } else {
          const pax = parseInt(capVal, 10);
          loadInput.value = pax ? `${pax * 68} Kg` : "";
        }
      }

      const speedInput = card.querySelector(".lift-speed");
      if (speedInput) {
        if (!type) speedInput.value = "";
        else if (type === "HOME LIFT") speedInput.value = "0.3 Mtr/sec";
        else if (type === "GOODS") speedInput.value = "0.5 Mtr/sec";
        else if (mr === "MR" && traction === "Geared") speedInput.value = "0.63 Mtr/sec";
        else speedInput.value = "1.0 Mtr/sec";
      }

      const pitInput = card.querySelector(".lift-pit");
      if (pitInput) {
        pitInput.value = !type ? "" : ((type === "HOME LIFT") ? "1000 MM" : "1600 MM");
      }

      const headroomInput = card.querySelector(".lift-headroom");
      if (headroomInput) {
        if (!type && !mr) headroomInput.value = "";
        else if (mr === "MR" && traction === "Geared") headroomInput.value = "4200 MM";
        else if (mr === "MR" && traction === "Gearless") headroomInput.value = "4500 MM";
        else headroomInput.value = "4800 MM";
      }

      const powerInput = card.querySelector(".lift-powersupply");
      if (powerInput) {
        powerInput.value = !type ? "" : ((type === "HOME LIFT")
          ? "220 Volt Single Phase 50 Hz AC"
          : "415 Volt 3 Phase 50 Hz AC");
      }
    }

    function handleStopsChange(element) {
      const card = element.closest(".lift-card");
      if (!card) return;

      const stops = parseInt(card.querySelector(".lift-stops").value, 10);
      if (stops && stops > 1) {
        const travelInput = card.querySelector(".lift-travel");
        travelInput.value = `${((stops - 1) * 3).toFixed(1)} Mtrs.`;

        const floorsInput = card.querySelector(".lift-floors");
        if (!floorsInput.value || floorsInput.value.startsWith("G+")) {
          floorsInput.value = `G+${stops - 1}`;
        }
      }
    }

    function handleFeature1Check(chk) {
      const card = chk.closest(".lift-card");
      if (!card) return;
      const hiddenInput = card.querySelector(".lift-feature1");
      if (hiddenInput) {
        hiddenInput.value = chk.checked ? "Overload Sensor & Indicator" : "";
      }

    /* Maximum Clear Door Width Rule by Passenger Capacity (Irrespective of Centre / Telescopic Door):
       - Upto 5 Passenger: 700 MM
       - 6 to 10 Passenger (incl. 8 & 10): 800 MM
       - 11 to 15 Passenger (incl. 13 & 15): 900 MM
       - 16 Passenger and above: 1000 MM */
    function getMaxDoorWidthByCapacity(liftType, capacityVal) {
      if (liftType === "GOODS") {
        return 1000;
      }
      const pax = parseInt(String(capacityVal || "").replace(/\D/g, ""), 10);
      if (!pax || isNaN(pax)) {
        return 1000;
      }
      if (pax <= 5) return 700;
      if (pax <= 10) return 800;
      if (pax <= 15) return 900;
      return 1000;
    }

    function handleShaftOrDoorChange(element) {
      const card = element.closest(".lift-card");
      if (!card) return;
      updateBestDoorWidth(card);
    }

    function updateBestDoorWidth(card) {
      if (!card) return;
      const liftType = card.querySelector(".lift-type").value;
      const capacityVal = card.querySelector(".lift-capacity").value;
      const shaftW = parseFloat(card.querySelector(".lift-shaft-w").value) || 0;
      const shaftD = parseFloat(card.querySelector(".lift-shaft-d").value) || 0;
      const doorType = card.querySelector(".lift-door-type").value;
      const displayWrap = card.querySelector(".door-w-display-wrap");
      const hiddenInput = card.querySelector(".lift-door-w");
      const liftIdx = card.dataset.liftIndex || "1";

      if (!displayWrap || !hiddenInput) return;

      if (shaftW <= 0 || shaftD <= 0 || !doorType) {
        hiddenInput.value = "";
        displayWrap.innerHTML = `<div class="door-w-placeholder">Select Shaft Dimensions &amp; Door Type</div>`;
        validateShaftDimensions(hiddenInput);
        return;
      }

      const isCenter = doorType.toLowerCase().includes("center");
      const maxShaftDoorW = isCenter ? (shaftW - 200) / 2 : (shaftW - 200) / 1.5;
      const maxCapDoorW = getMaxDoorWidthByCapacity(liftType, capacityVal);
      const effectiveMaxDoorW = Math.min(maxShaftDoorW, maxCapDoorW);

      const standardWidths = [600, 650, 700, 800, 900, 1000];
      let bestWidth = null;

      for (let i = standardWidths.length - 1; i >= 0; i--) {
        if (standardWidths[i] <= effectiveMaxDoorW) {
          bestWidth = standardWidths[i];
          break;
        }
      }

      if (bestWidth === null) {
        bestWidth = 600;
      }

      hiddenInput.value = String(bestWidth);
      displayWrap.innerHTML = `
        <label class="door-w-best-pill" title="Best possible clear door width for the entered Shaft Dimensions, Door Type & Passenger Capacity">
          <span class="door-w-best-left">
            <input type="radio" class="lift-door-w-radio" name="doorWidth_${liftIdx}" value="${bestWidth}" checked>
            <span>${bestWidth} MM</span>
          </span>
          <span class="door-w-best-badge">Best Fit</span>
        </label>
      `;

      validateShaftDimensions(hiddenInput);
    }

    function validateShaftDimensions(element) {
      const card = element.closest(".lift-card");
      if (!card) return;

      const doorType = card.querySelector(".lift-door-type").value;
      const doorW = parseFloat(card.querySelector(".lift-door-w").value) || 0;
      const shaftW = parseFloat(card.querySelector(".lift-shaft-w").value) || 0;
      const alertBox = card.querySelector(".dim-alert");
      if (!alertBox) return;

      const isCenter = doorType.toLowerCase().includes("center");
      const minRequired = isCenter ? (2 * doorW) + 200 : (1.5 * doorW) + 200;

      if (doorW > 0 && shaftW > 0 && shaftW < minRequired) {
        alertBox.style.display = "block";
        alertBox.innerHTML = `⚠️ <strong>Shaft Width Warning:</strong> Shaft Width of <strong>${shaftW} mm</strong> is less than required minimum <strong>${minRequired} mm</strong> for ${doorType} with ${doorW} mm door. (Formula: ${isCenter ? '2×Door + 200' : '1.5×Door + 200'})`;
      } else {
        alertBox.style.display = "none";
        alertBox.innerHTML = "";
      }
    }

    function updateTechnicalSummary() {
      const cards = document.querySelectorAll(".lift-card");
      let totalUnits = 0;
      const summaryParts = [];

      cards.forEach((card, idx) => {
        const qtyVal = card.querySelector(".lift-qty").value;
        const qty = parseInt(qtyVal, 10) || 0;
        const type = card.querySelector(".lift-type").value;
        const load = card.querySelector(".lift-load").value;

        if (qty > 0) {
          totalUnits += qty;
          const typeStr = type || `Elevator #${idx + 1}`;
          const loadStr = load ? ` (${load})` : "";
          summaryParts.push(`${qty} No${qty > 1 ? "s." : "."} ${typeStr}${loadStr}`);
        }
      });

      const sumUnitsElem = document.getElementById("sumUnits");
      const sumTypesElem = document.getElementById("sumTypes");

      if (sumUnitsElem) sumUnitsElem.innerText = totalUnits > 0 ? `${totalUnits} Units` : "0 Units";
      if (sumTypesElem) sumTypesElem.innerText = summaryParts.join(" • ") || "-";
    }

    /* Submission & Live REST Execution (Without Price & Without Returning Doc URL) */
    async function handleFormSubmit(e) {
      e.preventDefault();

      const salesPerson = document.getElementById("salesPersonSelect").value;
      if (!salesPerson) {
        showValidationAlert("Please select an assigned Sales Representative from the dropdown.");
        document.getElementById("salesPersonSelect").focus();
        return;
      }

      const customerName = document.getElementById("customerName").value.trim();
      const contactPerson = document.getElementById("contactPerson").value.trim();
      const contactPhone = document.getElementById("contactPhone").value.trim();
      const state = document.getElementById("state").value;
      const address1 = document.getElementById("address1").value.trim();
      const pinCode = document.getElementById("pinCode").value.trim();
      const siteAddress = document.getElementById("siteAddress").value.trim();
      const sitePinCode = document.getElementById("sitePinCode").value.trim();

      if (!customerName) {
        showValidationAlert("Please enter Customer / Company Name.");
        document.getElementById("customerName").focus();
        return;
      }
      if (!contactPerson) {
        showValidationAlert("Please enter Contact Person Name.");
        document.getElementById("contactPerson").focus();
        return;
      }
      if (!contactPhone || !/^\d{10}$/.test(contactPhone)) {
        showValidationAlert("Please enter a valid 10-digit Contact Phone Number.");
        document.getElementById("contactPhone").focus();
        return;
      }
      if (!state) {
        showValidationAlert("Please select a State / UT.");
        document.getElementById("state").focus();
        return;
      }
      if (!address1) {
        showValidationAlert("Please enter Office Address Line 1.");
        document.getElementById("address1").focus();
        return;
      }
      if (!pinCode || pinCode.length < 6) {
        showValidationAlert("Please enter a valid 6-digit Office PIN Code.");
        document.getElementById("pinCode").focus();
        return;
      }
      if (!siteAddress) {
        showValidationAlert("Please enter the Site Address.");
        document.getElementById("siteAddress").focus();
        return;
      }
      if (!sitePinCode || sitePinCode.length < 6) {
        showValidationAlert("Please enter a valid 6-digit Site PIN Code.");
        document.getElementById("sitePinCode").focus();
        return;
      }

      const cards = document.querySelectorAll(".lift-card");
      if (cards.length === 0) {
        showValidationAlert("Please configure at least one elevator specification.");
        return;
      }

      const liftsPayload = [];

      for (let i = 0; i < cards.length; i++) {
        const card = cards[i];
        const num = i + 1;

        const liftType = card.querySelector(".lift-type").value;
        const qty = card.querySelector(".lift-qty").value;
        const mr = card.querySelector(".lift-mr").value;
        const traction = card.querySelector(".lift-traction").value;
        const capacity = card.querySelector(".lift-capacity").value;
        const stops = card.querySelector(".lift-stops").value;
        const floors = card.querySelector(".lift-floors").value.trim();
        const travel = card.querySelector(".lift-travel").value.trim();
        const shaftW = card.querySelector(".lift-shaft-w").value;
        const shaftD = card.querySelector(".lift-shaft-d").value;
        const doorType = card.querySelector(".lift-door-type").value;
        const doorW = card.querySelector(".lift-door-w").value;
        const doorFinish = card.querySelector(".lift-door-finish").value;
        const vision = card.querySelector(".lift-vision").value;
        const ceiling = card.querySelector(".lift-ceiling").value;
        const panels = card.querySelector(".lift-panels").value;
        const flooring = card.querySelector(".lift-flooring").value;

        if (!liftType) { showValidationAlert(`Elevator #${num}: Please select Lift Type.`); return; }
        if (!qty || parseInt(qty, 10) < 1) { showValidationAlert(`Elevator #${num}: Please enter valid No. of Units.`); return; }
        if (!mr) { showValidationAlert(`Elevator #${num}: Please select Machine Room Config.`); return; }
        if (!traction) { showValidationAlert(`Elevator #${num}: Please select Traction Unit.`); return; }
        if (!capacity) { showValidationAlert(`Elevator #${num}: Please select Capacity.`); return; }
        if (!stops || parseInt(stops, 10) < 2) { showValidationAlert(`Elevator #${num}: Please enter valid No. of Stops (min 2).`); return; }
        if (!floors) { showValidationAlert(`Elevator #${num}: Please enter Serving Floors.`); return; }
        if (!travel) { showValidationAlert(`Elevator #${num}: Please enter Travel Distance.`); return; }
        if (!shaftW) { showValidationAlert(`Elevator #${num}: Please enter Shaft Width [W].`); return; }
        if (!shaftD) { showValidationAlert(`Elevator #${num}: Please enter Shaft Depth [D].`); return; }
        if (!doorType) { showValidationAlert(`Elevator #${num}: Please select Door Opening Type.`); return; }
        if (!doorW) { showValidationAlert(`Elevator #${num}: Please select Clear Door Width.`); return; }
        if (!doorFinish) { showValidationAlert(`Elevator #${num}: Please select Door Finish.`); return; }
        if (!vision) { showValidationAlert(`Elevator #${num}: Please select Vision Type.`); return; }
        if (!ceiling) { showValidationAlert(`Elevator #${num}: Please select Car Ceiling.`); return; }
        if (!panels) { showValidationAlert(`Elevator #${num}: Please select Car Panels.`); return; }
        if (!flooring) { showValidationAlert(`Elevator #${num}: Please select Car Flooring.`); return; }

        const isGoods = liftType === "GOODS";
        const isHome = liftType === "HOME LIFT";

        let computedSpeed = "1.0 Mtr/sec";
        if (isHome) computedSpeed = "0.3 Mtr/sec";
        else if (isGoods) computedSpeed = "0.5 Mtr/sec";
        else if (mr === "MR" && traction === "Geared") computedSpeed = "0.63 Mtr/sec";

        const computedPit = isHome ? "1000 MM" : "1600 MM";

        let computedHeadroom = "4800 MM";
        if (mr === "MR" && traction === "Geared") computedHeadroom = "4200 MM";
        else if (mr === "MR" && traction === "Gearless") computedHeadroom = "4500 MM";

        const computedLoad = isGoods 
          ? (capacity.includes("Kg") ? capacity : `${capacity} Kg`)
          : `${(parseInt(capacity, 10) || 6) * 68} Kg`;

        const computedPowerSupply = isHome
          ? "220 Volt Single Phase 50 Hz AC"
          : "415 Volt 3 Phase 50 Hz AC";

        liftsPayload.push({
          liftType: liftType,
          numElevators: parseInt(qty, 10) || 1,
          mrConfig: mr,
          tractionUnit: traction,
          capacity: isGoods ? "-" : capacity,
          ratedLoad: computedLoad,
          speed: computedSpeed,
          numStops: parseInt(stops, 10) || 2,
          servingFloors: floors,
          travel: travel,
          pitDepth: computedPit,
          headRoom: computedHeadroom,
          mainPowerSupply: computedPowerSupply,
          shaftWidth: parseFloat(shaftW) || 0,
          shaftDepth: parseFloat(shaftD) || 0,
          carDimensions: "Shall be as per GA Drawing",
          doorOpeningType: doorType,
          doorWidth: parseFloat(doorW) || 800,
          doorFinish: doorFinish,
          visionType: vision,
          carPanels: panels,
          carFlooring: flooring,
          carCeiling: ceiling,
          optionalFeature1: (() => {
            const chk = card.querySelector(".lift-feature1-check");
            return (chk && chk.checked) ? "Overload Sensor & Indicator" : "";
          })(),
          optionalFeature2: card.querySelector(".lift-feature2").value.trim()
        });
      }

      const payload = {
        customerName: customerName,
        contactPerson: contactPerson,
        contactPhone: contactPhone,
        state: state,
        address1: address1,
        address2: document.getElementById("address2").value.trim(),
        pinCode: pinCode,
        siteAddress: siteAddress,
        sitePinCode: sitePinCode,
        salesPerson: salesPerson,
        lifts: liftsPayload
      };

      showLoadingModal();
      const btnSubmit = document.getElementById("btnSubmit");
      btnSubmit.disabled = true;

      try {
        const res = await fetch(APPS_SCRIPT_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data && data.status === "success") {
          showThankYouModal(customerName);
        } else {
          showValidationAlert(data && data.message ? data.message : "The server encountered an issue processing your proposal.");
        }
      } catch (err) {
        console.error("Submission failed:", err);
        showValidationAlert("Network or Script Error: Unable to complete request. Please verify web app deployment permissions.");
      } finally {
        btnSubmit.disabled = false;
      }
    }

    /* Modals & Alerts */
    function showLoadingModal() {
      const overlay = document.getElementById("modalOverlay");
      const content = document.getElementById("modalBody");
      const footer = document.getElementById("modalFooter");
      overlay.style.display = "flex";
      footer.style.display = "none";
      content.innerHTML = `
        <div class="spinner"></div>
        <div class="modal-title">Submitting...</div>
        <p class="modal-msg" style="text-align: center; margin-bottom: 0;">Please wait while your proposal request is logged.</p>
      `;
    }

    function showThankYouModal(customerName) {
      const overlay = document.getElementById("modalOverlay");
      const content = document.getElementById("modalBody");
      const footer = document.getElementById("modalFooter");
      overlay.style.display = "flex";
      footer.style.display = "block";

      content.innerHTML = `
        <div class="modal-icon">✅</div>
        <div class="modal-title">Thank You!</div>
        <p class="modal-msg" style="text-align: center; margin-bottom: 4px;">
          Proposal request for <strong>${customerName}</strong> has been submitted successfully.
        </p>
      `;

      // Reset form and restore a single clean empty elevator card
      document.getElementById("proposalForm").reset();
      document.getElementById("liftsContainer").innerHTML = "";
      addLiftCard();
    }

    function showValidationAlert(message) {
      const overlay = document.getElementById("modalOverlay");
      const content = document.getElementById("modalBody");
      const footer = document.getElementById("modalFooter");
      overlay.style.display = "flex";
      footer.style.display = "block";
      content.innerHTML = `
        <div class="modal-icon">⚠️</div>
        <div class="modal-title">Notice</div>
        <p class="modal-msg" style="color: var(--danger); font-weight: 500; text-align: center;">${message}</p>
      `;
    }

    function closeModal() {
      document.getElementById("modalOverlay").style.display = "none";
    }

    /* Postal PIN Circle Auto State Detection */
    function getStateFromPinCode(pin) {
      if (!pin || pin.length < 2) return null;
      const s = String(pin).trim();
      const p2 = parseInt(s.slice(0, 2), 10);
      const p3 = s.length >= 3 ? parseInt(s.slice(0, 3), 10) : 0;

      if (p3 === 737) return "Sikkim";
      if (p3 === 744) return "Andaman and Nicobar Islands";
      if (p3 === 403) return "Goa";
      if (p3 === 160) return "Chandigarh";
      if (p3 === 682) return "Lakshadweep";
      if (p3 === 605) return "Puducherry";
      if (p3 >= 500 && p3 <= 509) return "Telangana";
      if (p3 >= 515 && p3 <= 535) return "Andhra Pradesh";
      if (p3 === 246 || p3 === 248 || p3 === 249 || p3 === 263) return "Uttarakhand";
      if ((p3 >= 825 && p3 <= 835) || p3 === 814 || p3 === 815 || p3 === 816) return "Jharkhand";
      if ((p3 >= 800 && p3 <= 813) || (p3 >= 841 && p3 <= 855)) return "Bihar";

      if (p2 === 79) {
        if (p3 >= 790 && p3 <= 792) return "Arunachal Pradesh";
        if (p3 === 793 || p3 === 794) return "Meghalaya";
        if (p3 === 795) return "Manipur";
        if (p3 === 796) return "Mizoram";
        if (p3 === 797 || p3 === 798) return "Nagaland";
        if (p3 === 799) return "Tripura";
        return "Assam";
      }

      if (p2 === 11) return "Delhi";
      if (p2 === 12 || p2 === 13) return "Haryana";
      if (p2 === 14 || p2 === 15) return "Punjab";
      if (p2 === 16) return "Chandigarh";
      if (p2 === 17) return "Himachal Pradesh";
      if (p2 === 18 || p2 === 19) return "Jammu and Kashmir";
      if (p2 >= 20 && p2 <= 28) return "Uttar Pradesh";
      if (p2 >= 30 && p2 <= 34) return "Rajasthan";
      if (p2 >= 36 && p2 <= 39) return "Gujarat";
      if (p2 >= 40 && p2 <= 44) return "Maharashtra";
      if (p2 >= 45 && p2 <= 48) return "Madhya Pradesh";
      if (p2 === 49) return "Chhattisgarh";
      if (p2 >= 50 && p2 <= 53) return "Andhra Pradesh";
      if (p2 >= 56 && p2 <= 59) return "Karnataka";
      if (p2 >= 60 && p2 <= 64) return "Tamil Nadu";
      if (p2 >= 67 && p2 <= 69) return "Kerala";
      if (p2 >= 70 && p2 <= 74) return "West Bengal";
      if (p2 >= 75 && p2 <= 77) return "Odisha";
      if (p2 === 78) return "Assam";
      if (p2 >= 80 && p2 <= 85) return "Bihar";

      return null;
    }

    function setMatchingState(stateName) {
      if (!stateName) return;
      const select = document.getElementById("state");
      if (!select) return;
      const target = stateName.trim().toLowerCase();

      for (let i = 0; i < select.options.length; i++) {
        if (select.options[i].value.toLowerCase() === target) {
          select.selectedIndex = i;
          return;
        }
      }
    }
  </script>
</body>
